spring.config.import=optional:file:.env[.properties]

server.error.include-stacktrace=never
spring.application.name=e-wallet

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

app.initial-admin.enabled=${APP_INITIAL_ADMIN_ENABLED:true}
app.initial-admin.username=${APP_INITIAL_ADMIN_USERNAME:admin}
app.initial-admin.first-name=${APP_INITIAL_ADMIN_FIRST_NAME:System}
app.initial-admin.middle-name=${APP_INITIAL_ADMIN_MIDDLE_NAME:N/A}
app.initial-admin.last-name=${APP_INITIAL_ADMIN_LAST_NAME:Admin}
app.initial-admin.email=${APP_INITIAL_ADMIN_EMAIL}
app.initial-admin.phone=${APP_INITIAL_ADMIN_PHONE}
app.initial-admin.pin=${APP_INITIAL_ADMIN_PIN}

otp.length = 6
otp.expiration-minutes = 5
otp.max-attempts = 5

pin-reset.length = 6
pin-reset.expiration-minutes = 5
pin-reset.max-attempts = 5
pin-reset.resend-cooldown-seconds = 60

spring.mail.host=${APP_MAIL_HOST}
spring.mail.port=${APP_MAIL_PORT}
spring.mail.username=${APP_MAIL_USER}
spring.mail.password=${APP_MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000


# Plaid Sandbox. Keys come from environment variables so they never sit in the repo.
plaid.base-url=https://sandbox.plaid.com
plaid.client-id=${PLAID_CLIENT_ID}
plaid.secret=${PLAID_SECRET}




plaid.idv-template-id=${PLAID_IDV_TEMPLATE_ID}
plaid.webhook-url=${PLAID_WEBHOOK_URL:}

# Demo limits per KYC tier (TZS). Replace with the regulator's tiers before real money.
limits.basic.per-payment=200000
limits.basic.daily=500000
limits.basic.max-balance=1000000
limits.verified.per-payment=3000000
limits.verified.daily=5000000
limits.verified.max-balance=10000000

# Plaid bank linking. The name check can be skipped only in Sandbox; the app refuses to start otherwise.
plaid.env=${PLAID_ENV:sandbox}
plaid.sandbox.skip-name-match=${PLAID_SANDBOX_SKIP_NAME_MATCH:false}
# Sandbox banks hold small USD amounts, so the demo converts at a fixed, labelled rate.
plaid.sandbox.usd-to-tzs=2600
# 32 random bytes, base64. Encrypts bank access tokens at rest. Generate one: openssl rand -base64 32
app.encryption-key=${APP_ENCRYPTION_KEY:}

# Agents can top up float from their own bank up to this much a day (TZS). Above it they use Request float.
agent.float.bank-topup-daily-cap=5000000

# Where the agent deposits when they request float (Path B). Demo values; shown on the Float screen.
escrow.bank-name=${ESCROW_BANK_NAME:Demo Trust Bank}
escrow.account-name=${ESCROW_ACCOUNT_NAME:WalletPesa Escrow Account}
escrow.account-number=${ESCROW_ACCOUNT_NUMBER:0150 2233 4455}

# Deposit slip photos are kept on disk, never in the database. Keep this folder out of git.
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
