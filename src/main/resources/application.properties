spring.config.import=optional:file:.env[.properties]

spring.application.name=e-wallet

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

app.initial-admin.enabled=${APP_INITIAL_ADMIN_ENABLED:true}
app.initial-admin.first-name=${APP_INITIAL_ADMIN_FIRST_NAME:System}
app.initial-admin.middle-name=${APP_INITIAL_ADMIN_MIDDLE_NAME:N/A}
app.initial-admin.last-name=${APP_INITIAL_ADMIN_LAST_NAME:Admin}
app.initial-admin.email=${APP_INITIAL_ADMIN_EMAIL}
app.initial-admin.phone=${APP_INITIAL_ADMIN_PHONE}
app.initial-admin.password=${APP_INITIAL_ADMIN_PASSWORD}
